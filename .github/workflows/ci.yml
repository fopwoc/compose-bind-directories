---
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - COPYRIGHT
      - LICENSE
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
      - COPYRIGHT
      - LICENSE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: python -m pip install ansible-core ansible-lint

      - name: Check role
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
        run: scripts/check.sh
