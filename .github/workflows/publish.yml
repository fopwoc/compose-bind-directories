---
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check semantic version tag
        shell: bash
        run: |
          tag_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            echo "Release tags must use semantic versioning, for example 1.2.3."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: python -m pip install ansible-core ansible-lint

      - name: Check role
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
        run: scripts/check.sh

      - name: Configure Galaxy API token
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$GALAXY_API_KEY" ]]; then
            echo "The GALAXY_API_KEY repository secret is not configured."
            exit 1
          fi
          install -d -m 0700 "$RUNNER_TEMP/ansible"
          printf 'token: %s\n' "$GALAXY_API_KEY" > "$RUNNER_TEMP/ansible/galaxy_token"
          chmod 0600 "$RUNNER_TEMP/ansible/galaxy_token"

      - name: Import role into Ansible Galaxy
        env:
          ANSIBLE_GALAXY_TOKEN_PATH: ${{ runner.temp }}/ansible/galaxy_token
        run: >-
          ansible-galaxy role import
          "$GITHUB_REPOSITORY_OWNER"
          "${GITHUB_REPOSITORY#*/}"

      - name: Create release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          else
            git log --reverse --format='- %s (%h)' "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
