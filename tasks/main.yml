---

- name: Validate Compose bind-directory inputs
  ansible.builtin.assert:
    that:
      - compose_bind_directories_compose_file | length > 0
      - compose_bind_directories_uid >= 0
      - compose_bind_directories_gid >= 0
      - compose_bind_directories_mode | length > 0
      - compose_bind_directories_allowed_roots | length > 0
      - >-
        compose_bind_directories_allowed_roots |
        select('match', '^/') |
        list |
        length == compose_bind_directories_allowed_roots | length
      - >-
        compose_bind_directories_allowed_roots |
        map('normpath') |
        select('equalto', '/') |
        list |
        length == 0
      - >-
        compose_bind_directories_excluded_sources |
        select('match', '^/') |
        list |
        length == compose_bind_directories_excluded_sources | length
    fail_msg: >-
      Compose file must not be empty. Directory UID and GID must be
      non-negative, directory mode must not be empty, allowed roots must be
      non-empty absolute paths other than /, and excluded sources must be
      absolute paths.

- name: Normalize Compose bind-directory policy paths
  ansible.builtin.set_fact:
    _compose_bind_directories_allowed_roots: >-
      {{
        compose_bind_directories_allowed_roots |
        map('normpath') |
        unique |
        list
      }}
    _compose_bind_directories_excluded_sources: >-
      {{
        compose_bind_directories_excluded_sources |
        map('normpath') |
        unique |
        list
      }}

- name: Resolve local Compose file path
  ansible.builtin.set_fact:
    _compose_bind_directories_compose_file_resolved: >-
      {{
        (
          compose_bind_directories_compose_file
          if compose_bind_directories_compose_file.startswith('/')
          else playbook_dir ~ '/' ~ compose_bind_directories_compose_file
        ) | normpath
      }}

- name: Inspect local Compose file
  become: false
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ _compose_bind_directories_compose_file_resolved }}"
  register: _compose_bind_directories_compose_file_status

- name: Require local Compose file
  ansible.builtin.assert:
    that:
      - _compose_bind_directories_compose_file_status.stat.exists
      - _compose_bind_directories_compose_file_status.stat.isreg
    fail_msg: >-
      Local Compose file does not exist or is not a regular file:
      {{ _compose_bind_directories_compose_file_resolved }}

- name: Discover Compose bind sources
  ansible.builtin.set_fact:
    _compose_bind_directories_sources: >-
      {{
        lookup(
          'ansible.builtin.template',
          _compose_bind_directories_compose_file_resolved
        ) |
        from_yaml |
        compose_bind_sources
      }}

- name: Select absolute bind-directory sources
  ansible.builtin.set_fact:
    _compose_bind_directories_paths: >-
      {{
        _compose_bind_directories_sources |
        select('match', '^/') |
        map('normpath') |
        reject(
          'in',
          _compose_bind_directories_excluded_sources
        ) |
        unique |
        list |
        compose_bind_paths_parent_first
      }}
    _compose_bind_directories_non_absolute_sources: >-
      {{
        _compose_bind_directories_sources |
        reject('match', '^/') |
        unique |
        list
      }}

- name: Reject the filesystem root as a bind directory
  ansible.builtin.assert:
    that:
      - "'/' not in _compose_bind_directories_paths"
    fail_msg: The filesystem root cannot be managed as a bind directory.

- name: Find Compose bind sources outside allowed roots
  ansible.builtin.set_fact:
    _compose_bind_directories_paths_outside_roots: >-
      {{
        _compose_bind_directories_paths |
        compose_bind_paths_outside_roots(
          _compose_bind_directories_allowed_roots
        )
      }}

- name: Require Compose bind sources to be within allowed roots
  ansible.builtin.assert:
    that:
      - _compose_bind_directories_paths_outside_roots | length == 0
    fail_msg: >-
      Compose bind sources are outside compose_bind_directories_allowed_roots:
      {{ _compose_bind_directories_paths_outside_roots | join(', ') }}

- name: Resolve canonical allowed roots on the managed host
  compose_bind_canonical_paths:
    paths: "{{ _compose_bind_directories_allowed_roots }}"
  register: _compose_bind_directories_canonical_allowed_root_results

- name: Resolve canonical bind sources on the managed host
  compose_bind_canonical_paths:
    paths: "{{ _compose_bind_directories_paths }}"
  register: _compose_bind_directories_canonical_path_results

- name: Collect canonical Compose bind-directory policy paths
  ansible.builtin.set_fact:
    _compose_bind_directories_canonical_allowed_roots: >-
      {{
        _compose_bind_directories_canonical_allowed_root_results.paths |
        map(attribute='canonical_path') |
        unique |
        list
      }}
    _compose_bind_directories_canonical_paths: >-
      {{
        _compose_bind_directories_canonical_path_results.paths |
        map(attribute='canonical_path') |
        list
      }}

- name: Find canonical Compose bind sources outside canonical allowed roots
  ansible.builtin.set_fact:
    _compose_bind_directories_canonical_paths_outside_roots: >-
      {{
        _compose_bind_directories_canonical_paths |
        compose_bind_paths_outside_roots(
          _compose_bind_directories_canonical_allowed_roots
        )
      }}

- name: Require canonical Compose bind sources to remain within allowed roots
  ansible.builtin.assert:
    that:
      - >-
        _compose_bind_directories_canonical_paths_outside_roots | length == 0
    fail_msg: >-
      Canonical Compose bind sources escape
      compose_bind_directories_allowed_roots through a symlinked ancestor:
      {{
        _compose_bind_directories_canonical_paths_outside_roots |
        join(', ')
      }}

- name: Report non-absolute bind sources left to the Compose project
  when: _compose_bind_directories_non_absolute_sources | length > 0
  ansible.builtin.debug:
    msg: >-
      Non-absolute bind sources are not prepared because they belong to the
      Compose project directory or require Compose environment interpolation:
      {{ _compose_bind_directories_non_absolute_sources | join(', ') }}

- name: Inspect Compose bind sources without following symlinks
  ansible.builtin.stat:
    path: "{{ _compose_bind_directories_path }}"
    follow: false
    get_attributes: false
    get_checksum: false
    get_mime: false
  loop: "{{ _compose_bind_directories_paths }}"
  loop_control:
    loop_var: _compose_bind_directories_path
    label: "{{ _compose_bind_directories_path }}"
  register: _compose_bind_directories_path_statuses

- name: Reject symlink and special-file bind sources
  ansible.builtin.assert:
    that:
      - >-
        not (_compose_bind_directories_path_status.stat.islnk | default(false))
        or compose_bind_directories_allow_symlinks
      - >-
        not _compose_bind_directories_path_status.stat.exists
        or (_compose_bind_directories_path_status.stat.isdir | default(false))
        or (_compose_bind_directories_path_status.stat.isreg | default(false))
        or (_compose_bind_directories_path_status.stat.islnk | default(false))
    fail_msg: >-
      Compose bind source is an unpermitted symlink or unsupported filesystem
      object:
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}
  loop: "{{ _compose_bind_directories_path_statuses.results }}"
  loop_control:
    loop_var: _compose_bind_directories_path_status
    label: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}

- name: Report existing regular-file bind sources left unchanged
  ansible.builtin.debug:
    msg: >-
      Existing regular-file bind source is left unchanged; add it to
      compose_bind_directories_excluded_sources to omit it from role reports:
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}
  when: _compose_bind_directories_path_status.stat.isreg | default(false)
  loop: "{{ _compose_bind_directories_path_statuses.results }}"
  loop_control:
    loop_var: _compose_bind_directories_path_status
    label: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}

- name: Report permitted symlink bind sources left unchanged
  ansible.builtin.debug:
    msg: >-
      Existing symlink bind source is explicitly permitted and left unchanged:
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}
  when: _compose_bind_directories_path_status.stat.islnk | default(false)
  loop: "{{ _compose_bind_directories_path_statuses.results }}"
  loop_control:
    loop_var: _compose_bind_directories_path_status
    label: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}

- name: Create missing Compose bind directories with requested attributes
  ansible.builtin.file:
    path: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}
    state: directory
    owner: "{{ compose_bind_directories_uid | string }}"
    group: "{{ compose_bind_directories_gid | string }}"
    mode: "{{ compose_bind_directories_mode }}"
    follow: false
    recurse: false
  when: not _compose_bind_directories_path_status.stat.exists
  loop: "{{ _compose_bind_directories_path_statuses.results }}"
  loop_control:
    loop_var: _compose_bind_directories_path_status
    label: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}

- name: Reconcile requested attributes on existing Compose bind directories
  ansible.builtin.file:
    path: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}
    state: directory
    owner: "{{ compose_bind_directories_uid | string }}"
    group: "{{ compose_bind_directories_gid | string }}"
    mode: "{{ compose_bind_directories_mode }}"
    follow: false
    recurse: false
  when:
    - compose_bind_directories_reconcile_existing
    - _compose_bind_directories_path_status.stat.isdir | default(false)
  loop: "{{ _compose_bind_directories_path_statuses.results }}"
  loop_control:
    loop_var: _compose_bind_directories_path_status
    label: >-
      {{ _compose_bind_directories_path_status._compose_bind_directories_path }}
