---

argument_specs:
  main:
    short_description: Prepare absolute Compose bind-mount directories
    options:
      compose_bind_directories_compose_file:
        description: Local Compose YAML or Jinja2 template file to inspect
        type: path
        required: true
      compose_bind_directories_uid:
        description: Numeric UID that should own discovered directories
        type: int
        required: true
      compose_bind_directories_gid:
        description: Numeric GID that should own discovered directories
        type: int
        required: true
      compose_bind_directories_mode:
        description: Permissions applied to discovered directories
        type: str
        default: "0755"
      compose_bind_directories_excluded_sources:
        description: Absolute bind sources that represent files or should not be managed
        type: list
        elements: path
        default: []
      compose_bind_directories_allowed_roots:
        description: Absolute roots under which bind directories may be managed
        type: list
        elements: path
        default:
          - /mnt/fast
          - /mnt/bulk
          - /mnt/data
      compose_bind_directories_allow_symlinks:
        description: Permit existing symlink bind sources without changing them
        type: bool
        default: false
      compose_bind_directories_reconcile_existing:
        description: Apply requested ownership and mode to existing directories
        type: bool
        default: false
